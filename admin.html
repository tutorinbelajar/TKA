<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin TO — Tutorin</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 min-h-screen text-slate-800"><main class="max-w-6xl mx-auto p-5 md:p-8"><div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6"><div><p class="text-emerald-700 font-black text-xs uppercase tracking-widest">Tutorin TKA</p><h1 class="text-3xl font-black">Dashboard Admin TO</h1><p class="text-slate-500 mt-1">Konfirmasi pembayaran dan terbitkan kode akses.</p></div><a href="./to.html" class="px-4 py-3 rounded-xl bg-white border font-bold">← Halaman TO</a></div>
<section id="login" class="bg-white rounded-3xl p-6 shadow-sm border max-w-lg"><h2 class="text-xl font-black">Admin Login</h2><p class="text-sm text-slate-500 mt-1">Masukkan token admin yang sudah dikonfigurasi di Supabase.</p><input id="token" type="password" class="mt-5 w-full border rounded-xl p-4" placeholder="Admin token"><button onclick="login()" class="mt-3 w-full bg-emerald-800 text-white rounded-xl p-4 font-black">MASUK</button><p id="loginErr" class="hidden text-red-600 font-bold text-sm mt-3">Token tidak valid.</p></section>
<section id="app" class="hidden"><div class="flex flex-col md:flex-row gap-3 mb-5"><button onclick="loadOrders()" class="bg-emerald-800 text-white px-5 py-3 rounded-xl font-black">↻ Refresh Order</button><div id="count" class="bg-white border rounded-xl px-5 py-3 font-bold"></div></div><div id="msg" class="hidden mb-4 p-4 rounded-xl font-bold"></div><div id="orders" class="grid gap-4"></div></section></main>
<script>
const API='https://ucdzqedssqblkzhljzgr.supabase.co/functions/v1/tka-public', APP='tutorin-tka-public-2026';let adminToken=sessionStorage.getItem('tka_admin_token')||'';
async function api(body){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-tutorin-app':APP,'x-admin-token':adminToken},body:JSON.stringify(body)});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request gagal');return j}
async function login(){adminToken=document.getElementById('token').value.trim();try{await api({action:'admin_orders'});sessionStorage.setItem('tka_admin_token',adminToken);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadOrders()}catch(e){document.getElementById('loginErr').classList.remove('hidden')}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
async function loadOrders(){try{let j=await api({action:'admin_orders'});document.getElementById('count').textContent=(j.orders||[]).length+' order';document.getElementById('orders').innerHTML=(j.orders||[]).map(o=>`<article class="bg-white rounded-2xl border p-5 shadow-sm"><div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4"><div><div class="flex flex-wrap gap-2"><span class="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-800 text-xs font-black">${esc(o.status)}</span><span class="px-2 py-1 rounded-lg bg-slate-100 text-xs font-bold">${esc(o.product_code)}</span></div><h3 class="text-lg font-black mt-2">${esc(o.product_name)}</h3><p class="text-sm text-slate-500">${money(o.price)} · ${new Date(o.created_at).toLocaleString('id-ID')}</p><p class="text-xs text-slate-400 mt-2 break-all">Order ID: ${esc(o.id)}</p></div><div class="md:text-right">${o.status==='pending'?`<button onclick="paid('${o.id}')" class="bg-emerald-800 text-white px-4 py-3 rounded-xl font-black">✓ Konfirmasi Bayar & Buat Kode</button>`:(o.access_code?`<div class="rounded-xl bg-emerald-50 p-4"><div class="text-xs font-bold text-emerald-700">KODE AKSES</div><div class="text-2xl font-black tracking-widest text-emerald-950">${esc(o.access_code)}</div><button onclick="navigator.clipboard.writeText('${esc(o.access_code)}')" class="mt-2 text-xs font-bold underline">Salin kode</button></div>`:'<span class="text-slate-400 font-bold">Dibayar</span>')}</div></div></article>`).join('')||'<div class="bg-white p-8 rounded-2xl text-slate-500">Belum ada order.</div>'}catch(e){show(e.message,true)}}
async function paid(id){if(!confirm('Konfirmasi pembayaran untuk order ini? Kode akses akan dibuat.'))return;try{let j=await api({action:'mark_paid',order_id:id});show('Pembayaran dikonfirmasi. Kode akses: '+j.access_code,false);loadOrders()}catch(e){show(e.message,true)}}
function show(t,bad){let x=document.getElementById('msg');x.textContent=t;x.className=(bad?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-800')+' mb-4 p-4 rounded-xl font-bold';}
if(adminToken){document.getElementById('token').value=adminToken;login()}
</script></body></html>
