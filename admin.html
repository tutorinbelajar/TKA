<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin TO — Tutorin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-slate-100 min-h-screen text-slate-800"><main class="max-w-6xl mx-auto p-5 md:p-8"><div class="flex justify-between gap-4 mb-6"><div><p class="text-emerald-700 font-black text-xs uppercase tracking-widest">Tutorin TKA</p><h1 class="text-3xl font-black">Dashboard Admin TO</h1><p class="text-slate-500">Konfirmasi pembayaran, terbitkan kode, dan kelola order.</p></div><a href="./to.html" class="px-4 py-3 h-fit rounded-xl bg-white border font-bold">← Halaman TO</a></div><section id="login" class="bg-white rounded-3xl p-6 shadow-sm border max-w-lg"><h2 class="text-xl font-black">Login Admin</h2><p class="text-sm text-slate-500 mt-1">Gunakan akun Supabase yang memiliki role admin.</p><input id="email" type="email" class="mt-5 w-full border rounded-xl p-4" placeholder="Email admin"><input id="password" type="password" class="mt-3 w-full border rounded-xl p-4" placeholder="Password"><button onclick="login()" class="mt-3 w-full bg-emerald-800 text-white rounded-xl p-4 font-black">MASUK</button><p id="loginErr" class="hidden text-red-600 font-bold text-sm mt-3"></p></section><section id="app" class="hidden"><div class="flex flex-wrap gap-3 mb-5"><button onclick="loadOrders()" class="bg-emerald-800 text-white px-5 py-3 rounded-xl font-black">↻ Refresh Order</button><button onclick="logout()" class="bg-white border px-5 py-3 rounded-xl font-black">Keluar</button><div id="count" class="bg-white border rounded-xl px-5 py-3 font-bold"></div></div><div id="msg" class="hidden mb-4 p-4 rounded-xl font-bold"></div><div id="orders" class="grid gap-4"></div></section></main><script>
const URL='https://ucdzqedssqblkzhljzgr.supabase.co',KEY='sb_publishable_YAiwu5UGSQydeLVcZSuJAA_6gRMxpKl',FN=URL+'/functions/v1/tka-admin',DEL=URL+'/functions/v1/tka-admin-v2',sb=window.supabase.createClient(URL,KEY);
async function call(endpoint,action,extra={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sesi login tidak ditemukan');const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request gagal');return j}
async function login(){const e=document.getElementById('loginErr');e.classList.add('hidden');try{const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;if(data.user?.app_metadata?.role!=='admin')throw Error('Akun belum memiliki role admin.');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadOrders()}catch(x){e.textContent=x.message;e.classList.remove('hidden')}}async function logout(){await sb.auth.signOut();location.reload()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
async function loadOrders(){try{const j=await call(FN,'admin_orders'),os=j.orders||[];count.textContent=os.length+' order';orders.innerHTML=os.map(o=>`<article class="bg-white rounded-2xl border p-5 shadow-sm"><div class="flex flex-col md:flex-row md:justify-between gap-4"><div><div class="flex gap-2"><span class="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-800 text-xs font-black">${esc(o.status)}</span><span class="px-2 py-1 rounded-lg bg-slate-100 text-xs font-bold">${esc(o.product_code)}</span></div><h3 class="text-lg font-black mt-2">${esc(o.product_name)}</h3><p class="text-sm text-slate-500">${money(o.price)} · ${new Date(o.created_at).toLocaleString('id-ID')}</p><p class="text-xs text-slate-400 mt-2 break-all">Order ID: ${esc(o.id)}</p></div><div class="flex flex-col gap-2 items-start">${o.status==='pending'?`<button onclick="paid('${o.id}')" class="bg-emerald-800 text-white px-4 py-3 rounded-xl font-black">✓ Konfirmasi Bayar & Buat Kode</button>`:(o.access_code?`<div class="rounded-xl bg-emerald-50 p-4"><div class="text-xs font-bold text-emerald-700">KODE AKSES</div><div class="text-2xl font-black tracking-widest">${esc(o.access_code)}</div><button onclick="navigator.clipboard.writeText('${esc(o.access_code)}')" class="mt-2 text-xs font-bold underline">Salin</button></div>`:'<span class="text-slate-400 font-bold">Dibayar</span>')}<button onclick="delOrder('${o.id}','${o.status}')" class="text-red-600 border border-red-200 px-3 py-2 rounded-xl text-xs font-black">🗑 Hapus Order</button></div></div></article>`).join('')||'<div class="bg-white p-8 rounded-2xl text-slate-500">Belum ada order.</div>'}catch(e){show(e.message,true)}}async function paid(id){if(!confirm('Konfirmasi pembayaran dan buat kode akses?'))return;try{const j=await call(FN,'mark_paid',{order_id:id});show('Berhasil. Kode akses: '+j.access_code,false);loadOrders()}catch(e){show(e.message,true)}}async function delOrder(id,status){let force=false;if(status==='paid'){if(!confirm('Order ini SUDAH PAID dan memiliki akses. Hapus hanya jika benar-benar diperlukan?'))return;force=true}else{if(!confirm('Hapus order pending ini? Ini cocok untuk order iseng/salah klik.'))return}try{await call(DEL,'delete_order',{order_id:id,force_paid:force});show('Order berhasil dihapus.',false);loadOrders()}catch(e){show(e.message,true)}}function show(t,bad){const x=document.getElementById('msg');x.textContent=t;x.className=(bad?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-800')+' mb-4 p-4 rounded-xl font-bold'}(async()=>{const {data:{session}}=await sb.auth.getSession();if(session?.user?.app_metadata?.role==='admin'){login.classList.add('hidden');app.classList.remove('hidden');loadOrders()}})();</script></body></html>
